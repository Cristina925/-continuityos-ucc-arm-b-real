name: UCC Arm B Real Kubernetes

on:
  workflow_dispatch:

jobs:
  ucc-arm-b:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create disposable cluster
        run: kind create cluster --name ucc-arm-b

      - name: Capture versions
        run: |
          kubectl version -o yaml > kubernetes-version.yaml
          kind version > kind-version.txt

      - name: Run frozen Arm-B harness
        run: python3 ucc_arm_b_real.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONTINUITYOS-UCC-VAL-002-B-REAL-001-EVIDENCE
          path: evidence/
